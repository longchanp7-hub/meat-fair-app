name: Rollout audit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rollout-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Capture public official-source fixtures
        run: |
          mkdir -p audit/pages audit/images
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import crypto from 'node:crypto';
          import { SOURCES } from './scripts/source-registry.mjs';
          import { linksFromHtml, textFromHtml, titleFromHtml, imageCandidatesFromHtml } from './scripts/fair-utils.mjs';
          const previous=JSON.parse(await fs.readFile('app/data/candidates.json','utf8'));
          const report=[];const assets=[];const fetched=new Map();
          const key=u=>crypto.createHash('sha1').update(u).digest('hex');
          const food=/フェア|フェス|期間限定|キャンペーン|厚切り|食べ放題|半額|割引|秋|台湾|ポルチーニ|鴨|松茸|サーモン/;
          const skip=/採用|求人|閉店|オープン|営業時間|株主|IR|福袋|テイクアウト|お持ち帰り|学生|フォロー|リポスト|抽選/;
          async function page(url,brand,kind){
            if(fetched.has(url))return fetched.get(url);
            try{
              const r=await fetch(url,{signal:AbortSignal.timeout(15000),headers:{'user-agent':'meat-fair-app/audit (+https://github.com/longchanp7-hub/meat-fair-app)'}});
              if(!r.ok)throw new Error(`HTTP ${r.status}`);
              if(!/html|text|xml/.test(r.headers.get('content-type')||''))throw new Error('not HTML');
              const html=await r.text();await fs.writeFile(`audit/pages/${key(url)}.html`,html);
              const links=linksFromHtml(html,r.url).filter(x=>/^https?:/.test(x.url));
              const images=imageCandidatesFromHtml(html,r.url,{title:titleFromHtml(html)||''}).filter(x=>/\.(?:png|jpe?g|webp)(?:\?|$)/i.test(x.url));
              const row={brandId:brand.brandId,kind,url,finalUrl:r.url,title:titleFromHtml(html),text:textFromHtml(html),links,images};
              fetched.set(url,row);report.push(row);
              return row;
            }catch(e){const row={brandId:brand.brandId,kind,url,error:String(e.message)};report.push(row);fetched.set(url,row);return row}
          }
          async function captureBrand(brand){
            const roots=[];for(const s of brand.sources)roots.push(await page(s.url,brand,'index'));
            const all=roots.flatMap(x=>x.links||[]);
            const hosts=new Set(brand.sources.map(s=>new URL(s.url).hostname));
            const indexLinks=all.filter(x=>hosts.has(new URL(x.url).hostname)&&/\/(?:news|topics|campaign|fair|event|information)\/?(?:index\.(?:html|php))?(?:\?.*)?$/.test(x.url));
            for(const l of indexLinks.slice(0,2)){const v=await page(l.url,brand,'index');all.push(...(v.links||[]))}
            const known=(previous.campaigns||[]).filter(c=>c.brandId===brand.brandId&&(c.lifecycleStatus==='current'||/2026\/09|taiwan|atsugiri/.test(c.officialUrl))).map(c=>({url:c.officialUrl,title:c.title}));
            const queue=[...all.filter(x=>hosts.has(new URL(x.url).hostname)&&food.test(x.title)&&!skip.test(x.title)),...known];
            const chosen=[...new Map(queue.map(x=>[x.url,x])).values()].filter(x=>!fetched.has(x.url)&&!/[.](?:pdf|jpg|png|webp)(?:\?|$)/i.test(x.url)&&!/(?:\/feed\/|\/page\/|\/category\/|\/tag\/|\/shop\/|\/store\/)/.test(x.url)).slice(0,12);
            for(const link of chosen)await page(link.url,brand,'detail');
            console.log(brand.brandId,JSON.stringify(report.filter(x=>x.brandId===brand.brandId).map(x=>({url:x.url,title:x.title,error:x.error}))));
          }
          for(let i=0;i<SOURCES.length;i+=3)await Promise.all(SOURCES.slice(i,i+3).map(captureBrand));
          const imageUrls=new Set();
          const live=JSON.parse(await fs.readFile('app/data/fairs.json','utf8'));
          for(const c of live.campaigns||[])if(c.imageUrl&&c.lifecycleStatus==='current')imageUrls.add(c.imageUrl);
          for(const p of report)for(const c of (p.images||[]).slice(0,p.kind==='detail'?3:1))imageUrls.add(c.url);
          async function image(url){try{const r=await fetch(url,{signal:AbortSignal.timeout(10000)});if(!r.ok||!/^image\//.test(r.headers.get('content-type')||''))return;const b=Buffer.from(await r.arrayBuffer());if(b.length>6000000)return;const file=`audit/images/${key(url)}`;await fs.writeFile(file,b);assets.push({url,file,type:r.headers.get('content-type')})}catch{}}
          const arr=[...imageUrls];for(let i=0;i<arr.length;i+=5)await Promise.all(arr.slice(i,i+5).map(image));
          await fs.writeFile('audit/report.json',JSON.stringify(report,null,2));
          await fs.writeFile('audit/assets.json',JSON.stringify(assets,null,2));
          console.log('Captured',report.length,'pages and',assets.length,'images');
          NODE
          tar -czf audit-snapshot.tgz app scripts package.json .github/workflows audit
      - uses: actions/upload-artifact@v4
        with:
          name: rollout-audit
          path: audit-snapshot.tgz
          retention-days: 3
