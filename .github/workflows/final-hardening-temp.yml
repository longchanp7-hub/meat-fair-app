name: Apply final hardening
on:
  push:
    branches:
      - fix/final-hardening-20260917
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-hardening-20260917
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply audited cleanup
        run: python scripts/final-hardening-apply.py
      - name: Verify hardening
        run: |
          if grep -RIE 'kushiya-monogatari|kushi-ya\.com|串家物語|串の日' app scripts --include='*.js' --include='*.mjs' --include='*.json'; then exit 1; fi
          npm test
          npm run quality-gate
          npm run verify
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: finish permanent chain purge and source hardening"
          git push origin HEAD:fix/final-hardening-20260917
