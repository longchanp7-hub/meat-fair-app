name: Deploy Pages
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      verify_browser:
        type: boolean
        default: false
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test && npm run quality-gate && npm run verify
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published files match the deployed commit
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify-public.mjs
      - name: Install browser test tools
        if: inputs.verify_browser || github.event_name == 'workflow_dispatch'
        run: |
          npm install --prefix /tmp/meat-browser --no-save --package-lock=false playwright@1.55.1
          /tmp/meat-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify live mobile and desktop app
        if: inputs.verify_browser || github.event_name == 'workflow_dispatch'
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          PLAYWRIGHT_MODULE: /tmp/meat-browser/node_modules/playwright
        run: node tests/browser-public.cjs
      - uses: actions/upload-artifact@v4
        if: always() && (inputs.verify_browser || github.event_name == 'workflow_dispatch')
        with:
          name: public-browser-report
          path: browser-report
          retention-days: 7
