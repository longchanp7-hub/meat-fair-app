name: Update fairs
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # 09:00 JST
  push:
    paths:
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/update-fairs.yml'
permissions:
  contents: write
concurrency:
  group: fair-data-refresh
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --ff-only origin main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run quality-gate
      - run: npm run update
      - run: npm run verify
      - name: Commit data changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/data
          git commit -m "chore: refresh fair data"
          git push origin HEAD:main
