name: Update fairs
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # 09:00 JST
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/update-fairs.yml'
      - '.github/workflows/deploy-pages.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: fair-data-refresh-v2
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.save.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Sync main and run regression checks
        run: |
          git pull --ff-only origin main
          npm test
          npm run quality-gate
      - name: Refresh all fourteen official sources
        run: npm run update
      - name: Verify generated public data
        run: npm run verify
      - name: Commit refreshed data without overwriting concurrent edits
        id: save
        run: |
          if ! git diff --quiet -- app/data scripts/reviewed-campaigns.json; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add app/data scripts/reviewed-campaigns.json
            git commit -m "chore: refresh all fourteen official fair sources"
            git pull --rebase origin main
            npm test
            npm run quality-gate
            npm run verify
            git push origin HEAD:main
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  deploy:
    needs: update
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ref: ${{ needs.update.outputs.commit }}
      verify_browser: true
