name: Rollout extra fixtures
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/rollout-extra.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Capture remaining public pages
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import crypto from 'node:crypto';
          import {linksFromHtml,textFromHtml,titleFromHtml,imageCandidatesFromHtml} from './scripts/fair-utils.mjs';
          await fs.mkdir('extra/pages',{recursive:true});await fs.mkdir('extra/images',{recursive:true});
          const pages=[
            ['anrakutei','https://anrakutei.jp/fair/290yenthanksf2/'],
            ['anrakutei','https://anrakutei.jp/fair/290yenthanks/'],
            ['anrakutei','https://anrakutei.jp/topic/20260907lunchth/'],
            ['jukusei-ichiban','https://www.jukusei-ichiban.jp/jp/menu/cat5.html'],
            ['onyasai','https://www.onyasai.com/lp/202609_kamoshabu_porcini/'],
            ['nikusho-sakai','https://www.yakiniku.jp/nikushou_sakai/news/taiwan_gourmet/'],
            ['nikusho-sakai','https://www.yakiniku.jp/nikushou_sakai/'],
            ['stamina-taro','https://staminataro.jp/2026/09/10/ninnikufair20260918/']
          ];const report=[],assets=[],queue=new Set();const key=u=>crypto.createHash('sha1').update(u).digest('hex');
          for(const [brandId,url] of pages){try{
            const r=await fetch(url,{signal:AbortSignal.timeout(15000),headers:{'user-agent':'meat-fair-app/rollout-audit'}});if(!r.ok)throw new Error(`HTTP ${r.status}`);
            const html=await r.text();await fs.writeFile(`extra/pages/${key(url)}.html`,html);
            const images=imageCandidatesFromHtml(html,url,{title:titleFromHtml(html)||''});
            report.push({brandId,url,finalUrl:r.url,kind:'detail',title:titleFromHtml(html),text:textFromHtml(html),links:linksFromHtml(html,url),images});
            for(const i of images)if(/\.(?:jpe?g|webp|png)(?:\?|#|$)/i.test(i.url)&&!/(?:logo|icon|button|btn|recruit|banner_brand)/i.test(i.url))queue.add(i.url);
          }catch(e){report.push({brandId,url,error:String(e.message)})}}
          async function image(url){try{const r=await fetch(url.replaceAll('&#038;','&').replaceAll('&amp;','&'),{signal:AbortSignal.timeout(10000)});if(!r.ok||!/^image\//.test(r.headers.get('content-type')||''))return;const bytes=Buffer.from(await r.arrayBuffer());if(bytes.length>7000000)return;const file=`extra/images/${key(url)}`;await fs.writeFile(file,bytes);assets.push({url,file,type:r.headers.get('content-type')})}catch{}}
          const q=[...queue];for(let i=0;i<q.length;i+=6)await Promise.all(q.slice(i,i+6).map(image));
          await fs.writeFile('extra/report.json',JSON.stringify(report,null,2));await fs.writeFile('extra/assets.json',JSON.stringify(assets,null,2));
          console.log(report.map(p=>({url:p.url,title:p.title,error:p.error})));console.log('images',assets.length);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: rollout-extra
          path: extra
          retention-days: 3
